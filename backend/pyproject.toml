[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iron-frontier-backend"
version = "0.1.0"
description = "FastAPI backend for Iron Frontier"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.11,<3.0",
  "sqlalchemy>=2.0.52,<2.1",
]

[project.optional-dependencies]
dev = [
  "black>=25.1",
  "httpx>=0.28",
  "isort>=6.0",
  "mypy>=1.17",
  "pylint>=3.3",
  "pytest>=8.4",
  "pytest-cov>=6.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pylint.main]
py-version = "3.11"

[tool.pylint.format]
max-line-length = 100

[tool.pylint.messages_control]
disable = ["too-few-public-methods"]
